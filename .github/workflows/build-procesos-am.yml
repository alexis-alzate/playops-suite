name: Build Procesos AM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION_4_APP_PROCESOS/**"
      - ".github/workflows/build-procesos-am.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VERSION_4_APP_PROCESOS/requirements.txt

      - name: Instalar NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Compilar actualización
        shell: powershell
        run: ./VERSION_4_APP_PROCESOS/build/build_release.ps1 -Version "14.4.6"

      - name: Publicar paquete
        uses: actions/upload-artifact@v4
        with:
          name: Procesos-AM-14.4.6
          path: VERSION_4_APP_PROCESOS/release/*
          if-no-files-found: error
          retention-days: 30
